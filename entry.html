<style>
:root{--bg:#f5f7fb;--fg:#2c3e50;--in:#fff;--bd:#cfd8e3;--mut:#6f7a8a;--box:#eef6fd}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--fg:#e8ebef;--in:#232b3a;--bd:#364154;--mut:#9aa6b5;--box:#1b2433}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali","Noto Sans Arabic",Tahoma,sans-serif;-webkit-text-size-adjust:100%}
.hide{display:none!important}
.wrap{max-width:520px;margin:0 auto;padding:18px 18px 40px}
h1{font-size:22px;margin:6px 0 4px;text-align:center}
.hi{text-align:center;color:var(--mut);margin:0 0 14px;font-size:16px}
label{display:block;font-weight:700;margin:18px 0 8px;font-size:18px;text-align:center}
.fld{width:100%;height:56px;border-radius:14px;border:1.5px solid var(--bd);background:var(--in);color:var(--fg);font:inherit;font-weight:700;font-size:22px;text-align:center;outline:none}
select.fld{font-size:19px;text-align-last:center;appearance:auto;-webkit-appearance:menulist}
input.fld{direction:ltr;background:linear-gradient(135deg,#b3d6a6,#aee89a);color:#1d3a1d}
.big2{display:flex;gap:12px;margin-top:14px}
.camb,.albb{flex:1;height:84px;border-radius:16px;border:2px solid #8fb97c;background:#fff;color:#1f5d2b;font:inherit;font-weight:800;font-size:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;padding:0;position:static}
.camb svg,.albb svg{width:30px;height:30px}
.send{display:block;width:100%;height:60px;border:0;border-radius:16px;background:#1f7a3a;color:#fff;font:inherit;font-weight:800;font-size:20px;margin-top:24px;cursor:pointer}
.send:disabled{opacity:.55}
.xb{margin-top:14px;border-radius:14px;padding:12px;font-weight:700;line-height:1.8;text-align:center;font-size:16px}
.xe{background:#fdecec;border:1.5px solid #e57373;color:#a32020}.xw{background:#fff4e0;border:1.5px solid #f0b350;color:#7a4b00}
.xp{background:var(--in);border:1.5px solid var(--bd);color:var(--fg)}.xp .xs{font-size:13px;font-weight:400;opacity:.8}
.xg{background:#e6f4e7;border:1.5px solid #8bc48e;color:#256a29}
.xbtn{display:block;width:100%;border:0;border-radius:14px;padding:14px;margin-top:12px;font:inherit;font-weight:800;font-size:17px;color:#fff;background:#e08a1e;cursor:pointer;text-align:center;text-decoration:none}
.xbtn.tel{background:#1f6fb2}

.swh{position:fixed;left:0;top:50%;width:40px;height:40px;margin-top:-20px;border-radius:50%;background:#1f6fb2;color:#fff;display:flex;align-items:center;justify-content:center;transform:translateX(-50px);opacity:0;pointer-events:none;z-index:300}
.help.bsh{text-decoration:none}
.err{color:#c0392b;text-align:center;font-weight:700;margin-top:14px;line-height:1.7}
.ok{text-align:center;padding:50px 10px}
.ok .tick{width:96px;height:96px;border-radius:50%;background:#3ecf8e;color:#fff;display:grid;place-items:center;margin:0 auto 18px;font-size:56px;font-weight:800}
.ok h2{margin:0 0 8px;font-size:26px}.ok p{color:var(--mut);font-size:17px;margin:0 0 24px}
.lgs{display:flex;flex-direction:column;gap:14px;margin-top:40px}
.lgs button{height:84px;border-radius:18px;border:2px solid var(--bd);background:var(--in);color:var(--fg);font:inherit;font-size:28px;font-weight:800;cursor:pointer}
.lgs button.sug{border-color:#1f7a3a}
.lgt{position:absolute;top:10px;inset-inline-start:12px;border:1.5px solid var(--bd);background:var(--in);color:var(--fg);border-radius:12px;height:36px;padding:0 12px;font:inherit;font-size:14px;cursor:pointer}
.cst{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:700;border-radius:20px;padding:6px 14px;margin:14px auto 0;width:fit-content;max-width:92%}
.cst i{width:10px;height:10px;border-radius:50%;flex:none}
.cst.ok{background:rgba(62,207,142,.18);color:#1c7f4a}.cst.ok i{background:#3ecf8e}
.cst.bad{background:rgba(239,83,80,.15);color:#c0392b}.cst.bad i{background:#ef5350}
.cst.wait{background:rgba(245,166,35,.2);color:#9a5b00}.cst.wait i{background:#f5a623}
.q{margin-top:14px;border:1.5px dashed #f5a623;background:rgba(245,166,35,.12);border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.8}
.lg2{display:inline-flex;background:rgba(255,255,255,.7);border:1px solid var(--bd);border-radius:999px;padding:3px;gap:2px;margin-top:10px}
.lg2 button{border:0;background:transparent;padding:8px 20px;border-radius:999px;font:inherit;font-weight:800;font-size:15px;color:var(--mut);cursor:pointer}.lg2 button.on{background:#1f7a3a;color:#fff}
.kic{width:68px;height:68px;border-radius:50%;background:rgba(31,122,58,.12);color:#1f7a3a;display:grid;place-items:center;margin:34px auto 14px}.kic.r{background:rgba(239,83,80,.13);color:#c0392b}
.cdw{position:relative;margin:14px auto 12px;max-width:300px}.cells{display:flex;gap:7px;justify-content:center;direction:ltr}.cells i{width:40px;height:54px;border-radius:12px;background:var(--in);border:1.5px solid var(--bd);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:26px;font-family:ui-monospace,Menlo,monospace}
.cells i.cur{border-color:#1f7a3a;box-shadow:0 0 0 3px rgba(31,122,58,.16)}.cells.bad i{border-color:#c0392b;background:rgba(239,83,80,.08)}.cells .sp{width:8px;background:none;border:0;box-shadow:none}
#cin{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border:0;background:transparent;color:transparent;caret-color:transparent}
.rem{font-size:13px;color:var(--mut);font-weight:700;margin:0 0 12px}.send:disabled{opacity:.45}
.bic{width:84px;height:84px;border-radius:50%;background:rgba(239,83,80,.15);color:#c0392b;display:grid;place-items:center;font-size:46px;margin:44px auto 16px}
#bad{color:var(--fg);font-weight:400;font-size:16px;line-height:2;margin:0 0 10px}
.tipb{background:var(--in);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.9;color:var(--mut)}
.help{display:block;margin:26px auto 0;background:transparent;border:0;font:inherit;font-size:14px;font-weight:700;color:#2a56b8;text-decoration:underline;text-underline-offset:4px;cursor:pointer;padding:8px 12px}
#vtut{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;background:radial-gradient(120% 60% at 20% 0%,rgba(63,157,107,.16) 0%,transparent 55%),var(--bg)}
.tsk{align-self:flex-start;padding:14px 18px;background:transparent;border:0;font:inherit;font-size:14px;font-weight:700;color:var(--mut);cursor:pointer;min-height:48px}
#tsc{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}#tsc::-webkit-scrollbar{display:none}
.tsl{flex:0 0 100%;scroll-snap-align:start;padding:6px 24px 10px;display:flex;flex-direction:column;align-items:center;text-align:center;max-width:520px;margin:0 auto;overflow-y:auto}
.tsl h3{margin:20px 0 8px;font-size:22px}.tsl p{font-size:15px;line-height:1.9;color:var(--mut);margin:0 0 8px}
.ill{width:100%;height:150px;border-radius:16px;background:var(--box);border:1px solid var(--bd);display:grid;place-items:center;margin-top:6px;position:relative}
.ill .fr{position:absolute;width:190px;height:70px;border:3px solid #f5c400;border-radius:12px}.ill .lcd{width:160px;height:46px;border-radius:8px;background:linear-gradient(135deg,#b3d6a6,#aee89a);display:grid;place-items:center;font-weight:800;direction:ltr;color:#1d3a1d}
.mb2{display:flex;gap:8px;width:100%;margin-top:8px}.mb2 div{flex:1;height:44px;border-radius:12px;border:2px solid #8fb97c;background:var(--in);display:grid;place-items:center;font-size:12px;font-weight:800;color:#1f5d2b}
.msb{height:44px;width:100%;border-radius:12px;background:#1f7a3a;color:#fff;display:grid;place-items:center;font-weight:800;margin-top:8px}
.mf{height:44px;border-radius:12px;background:linear-gradient(135deg,#b3d6a6,#aee89a);display:grid;place-items:center;font-weight:800;width:100%;direction:ltr;color:#1d3a1d}
.li{width:100%;text-align:start;display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.7;margin:7px 0;background:var(--in);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;color:var(--fg)}
.li b{display:block;font-size:15px}.li .nm{width:26px;height:26px;border-radius:50%;background:#1f7a3a;color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.cl{width:100%;display:flex;gap:10px;align-items:center;margin:6px 0;font-size:13.5px;line-height:1.6;text-align:start;color:var(--fg)}
.pl{font-size:12px;font-weight:700;border-radius:14px;padding:5px 10px;display:inline-flex;gap:6px;align-items:center;justify-content:center;white-space:nowrap;width:128px;flex:none}.pl i{width:9px;height:9px;border-radius:50%}
.pl.ok{background:rgba(62,207,142,.18);color:#1c7f4a}.pl.ok i{background:#3ecf8e}.pl.bad{background:rgba(239,83,80,.15);color:#c0392b}.pl.bad i{background:#ef5350}.pl.wait{background:rgba(245,166,35,.2);color:#9a5b00}.pl.wait i{background:#f5a623}
.bigok{width:84px;height:84px;border-radius:50%;background:#34c759;color:#fff;font-size:48px;display:grid;place-items:center;margin-top:40px;box-shadow:0 8px 20px rgba(52,199,89,.35)}
.ga{display:inline-flex;align-items:center;gap:9px;margin-top:20px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.55);backdrop-filter:blur(14px) saturate(1.6);-webkit-backdrop-filter:blur(14px) saturate(1.6);border:1px solid rgba(255,255,255,.8);box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 4px 14px rgba(0,0,0,.08);font:inherit;font-size:13px;font-weight:600;color:#3a3a3c;cursor:pointer}
@media (prefers-color-scheme:dark){.ga{background:rgba(60,60,67,.55);border-color:rgba(255,255,255,.12);color:#e8ebef}}
.rc{width:20px;height:20px;border-radius:50%;border:1.6px solid #b4bac4;background:rgba(255,255,255,.6);display:grid;place-items:center;flex:none}
.ga.on .rc{background:#0a84ff;border-color:#0a84ff;box-shadow:0 2px 6px rgba(10,132,255,.4)}
.ga.on .rc:after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.tdt{display:flex;gap:6px;justify-content:center;margin:8px 0 10px}.tdt i{width:8px;height:8px;border-radius:50%;background:#c4ccd8;transition:.2s}.tdt i.on{background:#1f7a3a;width:22px;border-radius:5px}
.tnx{display:flex;gap:8px;padding:0 18px calc(16px + env(safe-area-inset-bottom,0px));max-width:520px;width:100%;margin:0 auto}
.tnx button{flex:1;height:48px;border-radius:14px;font:inherit;font-weight:800;font-size:16px;cursor:pointer}
.tn1{background:#1f7a3a;color:#fff;border:0}.tn2{background:var(--in);color:var(--mut);border:1.5px solid var(--bd)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:99}.toast.on{opacity:1}
body.ltr .wrap{direction:ltr}
.cw{position:relative}.cw .fld{padding-inline:90px}
.camb{position:absolute;left:6px;top:6px;width:36px;height:36px;border-radius:10px;border:1.5px solid #8fb97c;background:#fff;color:#1f5d2b;display:grid;place-items:center;padding:0;cursor:pointer}
.camb.alb{left:48px}
.mcam{position:fixed;inset:0;z-index:60;background:#000;color:#fff;display:flex;flex-direction:column}
.mcam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mcam .mfr{position:absolute;left:50%;top:38%;width:min(86vw,440px);aspect-ratio:2.6/1;transform:translate(-50%,-50%);border:3px solid #ffd60a;border-radius:12px;box-shadow:0 0 0 100vmax rgba(0,0,0,.55)}
.mcam .mh{position:absolute;top:calc(34px + env(safe-area-inset-top,0px));left:20px;right:20px;text-align:center;font-weight:700;font-size:17px;line-height:1.7;text-shadow:0 1px 3px #000}
.mcam .mh2{position:absolute;left:50%;top:calc(38% + min(86vw,440px)/5.2 + 14px);transform:translateX(-50%);background:rgba(0,0,0,.7);border-radius:10px;padding:3px 12px;font-size:14px;white-space:nowrap}
.mcam .mx{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:14px;width:44px;height:44px;border:0;background:rgba(0,0,0,.45);color:#fff;border-radius:50%;font-size:24px;line-height:1}
.mcam .msh{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom,0px));left:50%;margin-left:-34px;width:68px;height:68px;border-radius:50%;border:5px solid #fff;background:transparent;padding:0}.mcam .msh i{display:block;width:50px;height:50px;border-radius:50%;background:#fff;margin:auto}
.mres{position:fixed;inset:0;z-index:61;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.mres .ms{position:relative;width:min(100%,460px);background:var(--in,#fff);color:var(--fg,#2c3e50);border-radius:24px 24px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(0,0,0,.25)}
.mres .mxx{position:absolute;left:26px;top:26px;width:34px;height:34px;border-radius:50%;border:0;padding:0;background:rgba(20,30,20,.45);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:#fff;display:grid;place-items:center;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.4);cursor:pointer}
.mres canvas{display:block;width:100%;max-width:340px;margin:0 auto 12px;border-radius:12px;border:1px solid var(--bd,#ccc);background:#fff}
.mres .mt{text-align:center}.mres .mt span{display:inline-block;border-radius:20px;padding:3px 12px;font-size:14px;font-weight:700;background:#e4f6df;color:#1d6b2b}.mres .mt span.w{background:#fff1d6;color:#9a5b00}
.mres .mn{font-size:44px;font-weight:800;text-align:center;direction:ltr;letter-spacing:1px;line-height:1.3}.mres .mn.off{color:#b9b9b9}
.mres .mw{text-align:center;font-size:14px;line-height:1.8;color:#9a5b00;margin:4px 6px 0}
.mres .mb{display:flex;gap:10px;margin-top:14px}.mres .mb button{flex:1;height:48px;border-radius:13px;font-weight:800;font-size:14px;font-family:inherit;border:1.5px solid #b7c0cf;background:#fff;color:#1f2933;white-space:nowrap}
.mres .mb button.p{flex:1.5;background:#1f7a3a;border-color:#1f7a3a;color:#fff}.mres .mb button.p:disabled{background:#e3e6eb;border-color:#e3e6eb;color:#9aa4b2}
#camb,#albb{position:static;left:auto;top:auto;width:auto;height:84px;flex:1;border-radius:16px;border:2px solid #8fb97c;font-size:16px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.mres{--in:#fff;--fg:#2c3e50}
.mres .mlab{display:block;font-weight:700;font-size:14px;margin:4px 2px 6px}.mres canvas{max-height:34vh;object-fit:contain}
.phrow{display:flex;align-items:center;gap:10px;margin:10px 0 0;padding:8px;border:1.5px solid #8fb97c;border-radius:14px;background:rgba(62,207,142,.1);font-weight:700;color:#1c7f4a}.phrow img{width:84px;height:46px;object-fit:cover;border-radius:8px}.phrow span{flex:1;font-size:14px}.phrow button{width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.12);color:inherit;font-size:14px}
@media (prefers-color-scheme:dark){.mres{--in:#232b3a;--fg:#e8ebef}}
.brd{display:flex;align-items:center;gap:8px;justify-content:center;margin:2px 0 10px;font-size:15px;color:var(--mut,#7b8794)}.brd img{border-radius:8px}.brd b{color:inherit}
.ash,.ms,.mres,.amn{overscroll-behavior:contain}
</style>
</head>

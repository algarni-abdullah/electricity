function readBox(cv,b){var W=340,H=Math.max(40,Math.round(b[3]*W/b[2])),c=document.createElement("canvas");c.width=W;c.height=H;
 var x=c.getContext("2d");x.imageSmoothingQuality="high";x.drawImage(cv,b[0],b[1],b[2],b[3],0,0,W,H);
 var r=null;try{r=MOCR.read(c)}catch(e){}
 var num=r?MOCR.clean(r.text):null,st="c";
 if(r&&r.match!=null){if(r.match>=.45&&r.eight>=.3){st=r.zero>=.25?"a":(r.zero<.12?"d":"c")}else if(r.match>=.35&&r.eight<.2)st="b"}
 var sc=(st==="a"&&num?1000+r.match:(st==="b"||st==="d")?500+r.match:num?200+r.match:(r?r.text.replace(/[^0-9]/g,"").length:0));
 return {c:c,num:num,st:st,r:r,sc:sc}}
function process(cv){
 var cands=[],ms=[[.02,.04],[.05,.09],[.1,.14]];
 [true,false].forEach(function(s){var b=core(cv,s);if(b)ms.forEach(function(m){cands.push(expand(b,m[0],m[1],cv))})});
 if(!cands.length)cands.push([0,0,cv.width,cv.height]);
 var best=null,i;for(i=0;i<cands.length;i++){var o=readBox(cv,cands[i]);if(!best||o.sc>best.sc)best=o;if(best.sc>=1000&&best.r&&best.r.match>.8)break}
 cur={num:best.num,ok:best.st==="a"&&!!best.num};show(best.c,best.num,best.st,best.r)}

 if(st==="a"&&num){tag.className="";tag.textContent="\u2713 1.8.0";n.className="mn";n.textContent=num;why.textContent="";use.disabled=false}
 else if(st==="b"||st==="d"){tag.className="w";tag.textContent=st==="b"?T("t170"):T("tn180");n.className="mn off";n.textContent="\u2014";why.textContent=T("w1");use.disabled=true}
 else{tag.className="w";tag.textContent=num?T("tun"):T("tno");
  n.className="mn off";n.textContent=num||"\u2014";
  why.textContent=num?T("w2"):T("w3");use.disabled=true}
 g("mres").classList.remove("hide")}

 im.onerror=function(){URL.revokeObjectURL(u)};im.src=u}

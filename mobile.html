<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الكهرباء">
<meta name="theme-color" content="#5b9bd5">
<title>حاسبة الكهرباء</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--bg:#f5f7fb;--fg:#2c3e50;--card:#f4fbf4;--cb:#a8e0a8;--bd:#cfd8e3;--in:#fff;--box:#eef6fd;--link:#3b6fe0;--mut:#8a94a3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--fg:#e8ebef;--card:#18261d;--cb:#3b6b47;--bd:#364154;--in:#232b3a;--box:#1b2433;--link:#7aa2ff;--mut:#9aa6b5}}
:root[data-theme="dark"]{--bg:#14171c;--fg:#e8ebef;--card:#18261d;--cb:#3b6b47;--bd:#364154;--in:#232b3a;--box:#1b2433;--link:#7aa2ff;--mut:#9aa6b5}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Noto Sans Arabic",-apple-system,"Geeza Pro",Tahoma,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:620px;margin:0 auto;padding:16px 16px 40px}.wrap.wide{max-width:1100px}#hist.wrap.wide{max-width:none}
h2{margin:6px 0 14px;font-size:21px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.top h2{margin:0}
.sm{height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--bd);background:var(--in);color:var(--fg);font:inherit;font-size:15px}
label{display:block;text-align:center;font-weight:700;margin:16px 0 8px;font-size:18px}
.fld{width:100%;height:48px;border-radius:12px;border:1px solid var(--bd);font-weight:600;font-size:19px;font-family:inherit;text-align:center;color:#2c3e50;outline:none}
.fld.prev{background:linear-gradient(135deg,#e2e2e2,#c4c4c4);color:#666}
.fld.curr{background:linear-gradient(135deg,#b3d6a6,#aee89a)}
.fld.date{background:var(--in);color:var(--fg);font-weight:400;direction:ltr}
.fld.days{background:var(--box);color:var(--fg);font-weight:700}
.row{display:block}.dsel{display:flex;gap:6px}.dsel select{flex:1;min-width:0;height:48px;border-radius:12px;border:1px solid var(--bd);background:var(--in);color:var(--fg);font-size:17px;font-family:inherit;text-align:center;text-align-last:center}
details{margin-top:20px;background:var(--box);border:1px solid var(--bd);border-radius:12px;padding:6px 16px 16px}
summary{cursor:pointer;color:var(--link);text-align:center;padding:12px 0;font-size:16px;list-style:none}
summary::-webkit-details-marker{display:none}
details .fld{background:var(--in);color:var(--fg);font-weight:400}
.btn{display:block;width:100%;height:52px;border:0;border-radius:12px;color:#fff;font-weight:700;font-size:18px;font-family:inherit;margin-top:18px}
.b1{background:#5b9bd5}.b2{background:#e57770}.b3{background:#3f9d6b}.b4{background:#8a6fd1}
.res{margin-top:22px;border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--in)}
.res div{display:flex;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--bd);gap:10px}
.res div:last-child{border:0}.res .tot{background:var(--box);font-weight:700;font-size:19px}
.res b{direction:ltr;unicode-bidi:embed}
.err{color:#e57770;text-align:center;margin-top:14px;font-weight:600}
/* home */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.mc{background:var(--card);border:1.5px dashed var(--cb);border-radius:20px;padding:16px}
.mc .h{display:flex;justify-content:space-between;align-items:center;min-height:80px}
.mc .nm{font-weight:700;font-size:18px}
.bdg{border:1.5px solid #a8e0a8;background:#e6f8e6;color:#2d6a3a;border-radius:20px;padding:6px 14px;font-weight:700;font-size:14px}
.bdg.w{border-color:#f2a9a3;background:#fdeceb;color:#c0392b}
.pill{flex:1;border:1px solid var(--bd);border-radius:14px;padding:12px;text-align:center;color:var(--mut);font-weight:700;font-size:15px;background:var(--in)}
.nx{margin:10px 0;border:1.5px solid var(--cb);border-radius:14px;padding:10px 12px;background:rgba(120,200,120,.12);font-weight:700;font-size:14px}
.nx span{display:block;color:var(--mut);font-size:17px;margin-top:2px;direction:ltr;text-align:right}
.ac{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ac button{height:40px;border:0;border-radius:12px;font-weight:700;font-size:16px;font-family:inherit;color:#111}
.nw{background:#5aa3e4;color:#fff!important}.hs{background:#6fc7ec}.ed{background:#f0c33c}
.empty{text-align:center;color:var(--mut);padding:40px 0}
/* history */
.sc{overflow-x:auto;background:var(--in);border:1px solid var(--bd);border-radius:16px}
table{border-collapse:collapse;width:100%;min-width:0;font-size:14px}
th{background:rgba(128,128,128,.12);padding:12px 14px;font-weight:700}
td{padding:10px 14px;text-align:center;border-top:2px solid var(--bd)}
th:nth-child(2),td:nth-child(2){width:64px;max-width:72px;word-break:break-word}
th:nth-child(8),th:nth-child(9),td:nth-child(8),td:nth-child(9){min-width:96px;white-space:nowrap}
th:nth-child(11){min-width:120px}
.sm2{font-size:11px;font-weight:400;opacity:.85}
.tb{display:inline-block;background:#3b5bdb;color:#fff;border-radius:14px;padding:3px 10px;font-weight:700}
.tb.z{background:#d9534f}
td small{display:block;margin-top:2px}
.ob{display:flex;flex-direction:column;gap:6px;min-width:120px}
.ob button{height:32px;border:0;border-radius:10px;color:#fff;font-weight:700;font-size:13px;font-family:inherit}
.g{background:#6fcf6f}.bl{background:#79a2f0}.rd{background:#d4574a}.gr{background:#697386}
.sortw{position:relative;display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border:1px solid var(--bd);border-radius:10px;background:var(--in);font-size:15px}.sortw select{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:9}
.toast.on{opacity:1}.hide{display:none!important}
/* invoice */
#inv{background:var(--inv);min-height:100vh;padding:14px 10px 40px}
.acts{display:flex;gap:8px;max-width:620px;margin:0 auto 12px}
.acts button{flex:1;height:44px;border-radius:10px;border:0;font-weight:700;font-size:14px;font-family:inherit;background:#5b9bd5;color:#fff}
.acts button.k{background:#777}
.ck{display:none}.selm .ck{display:table-cell}.ck input{width:20px;height:20px}
.selbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--in)}.selbar b{margin-inline-end:auto}
.sm.rdb{background:#d4574a;color:#fff;border-color:#d4574a}.br{background:#9c6a3d}
@media (max-width:1250px){td,th{padding-left:9px;padding-right:9px}}
@media (max-width:1000px){table{min-width:1000px}}
.ot{background:#1c7f74}
.mnu{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}
.mbx{background:var(--bg);color:var(--fg);border-radius:18px;padding:16px;width:min(340px,100%);display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.mt{text-align:center;font-weight:700;margin-bottom:4px}
.mi{height:46px;border:0;border-radius:12px;color:#fff;font-weight:700;font-size:16px;font-family:inherit}
.mi.pr{background:#6b4fb3}.mi.sh{background:#26803a}.mi.ed{background:#9c6a3d}.mi.dl{background:#c0392b}.mi.cx{background:transparent;color:var(--fg);border:1px solid var(--bd)}
.ckl{display:none;align-items:center}.selm .ckl{display:inline-flex}.ckl input{width:24px;height:24px}
.rc{background:var(--in);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.rt{display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--bd);padding-bottom:10px;margin-bottom:6px}
.rn{font-weight:700;font-size:18px}.rtot{margin-inline-start:auto;font-weight:700;font-size:20px;text-align:left}.rtot small{display:block;font-size:11px;font-weight:400}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;font-size:15px;border-bottom:1px dashed var(--bd)}.kv span{color:var(--mut)}.kv b{direction:ltr}
.rf{display:flex;gap:8px;margin-top:12px}.rf button{flex:1;height:46px;border:0;border-radius:12px;color:#fff;font-weight:700;font-size:16px;font-family:inherit}.rf .bl{background:#3b79d8}
.wrap{padding-left:14px;padding-right:14px}
.infobox{display:none;align-items:center;gap:12px;margin:10px auto;max-width:620px;padding:12px 16px;border:2px solid #3b79d8;border-radius:14px;background:rgba(59,121,216,.12);font-weight:700;line-height:1.8}
.infobox span{flex:1}.infobox a{color:var(--link)}.infobox button{border:0;background:transparent;color:var(--fg);font-size:20px;padding:4px 8px}
@media (min-width:1272px){.infobox{display:flex}}.infobox.dis{display:none!important}
.fld.bad{border:2px solid #e57770}

/* ---- unified buttons, dark OLED, tooltip, misc ---- */
:root{--btn:#fff;--btnfg:#1f2933;--btnbd:#aab4c3;--inv:#ddd;--warnfg:#a96b00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--btn:#2d3749;--btnfg:#fff;--btnbd:#4d5a72;--inv:#ddd;--warnfg:#ffc266}}
:root[data-theme="dark"]{--btn:#2d3749;--btnfg:#fff;--btnbd:#4d5a72;--inv:#ddd;--warnfg:#ffc266}
html{background:var(--bg)}
.btn,.ob button,.ac button,.rf button,.acts button,.mi:not(.dl){background:var(--btn)!important;color:var(--btnfg)!important;border:1.5px solid var(--btnbd)!important}
.sm:not(.rdb),.sortw{background:var(--btn);color:var(--btnfg);border-color:var(--btnbd)}
#dm{background:#c0392b!important;color:#fff!important;border-color:#c0392b!important}
.mbx{width:min(250px,100%);padding:14px;gap:8px;border:1px solid var(--bd)}
.mi{height:38px;border-radius:10px;font-size:14px}
.pen{background:none;border:0;color:var(--mut);padding:2px 6px;margin-inline-start:2px;vertical-align:middle;cursor:pointer}
.tip{display:inline-block;width:17px;height:17px;line-height:14px;text-align:center;border:1.5px solid currentColor;border-radius:50%;font-size:11px;font-weight:700;cursor:help;margin-inline-start:4px;vertical-align:middle;color:var(--link)}
#tipbox{position:fixed;display:none;z-index:40;max-width:240px;background:#222;color:#fff;padding:8px 12px;border-radius:10px;font-size:13px;line-height:1.7;text-align:right;box-shadow:0 4px 18px rgba(0,0,0,.4);pointer-events:none}
.warn{margin-top:18px;padding:12px 14px;border:2px solid #e0a030;border-radius:12px;background:rgba(224,160,48,.15);color:var(--warnfg);font-weight:700;line-height:1.8}
.acts button svg{vertical-align:middle}

/* ---- invoice: all sizes follow the sheet width, so screen / print / PDF look identical ---- */
.sheet{container-type:inline-size;background:#fff;color:#000;max-width:620px;margin:0 auto;line-height:1.45}
.sheet .bar{height:1.6cqw;background:#000}
.sheet .sin{padding:3.5cqw 4.2cqw 4cqw}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;gap:3cqw;margin-bottom:3cqw}
.sheet h1{font-size:4cqw;margin:0}
.sheet .lg{width:10cqw;height:10cqw;object-fit:contain;flex:none}
.sheet .meta{display:grid;grid-template-columns:1fr 1fr;gap:.6cqw 2cqw;font-size:2.4cqw;margin-bottom:2.2cqw}.sheet .meta .f{grid-column:1/-1}
.sheet .th,.sheet .tr{display:grid;grid-template-columns:1fr 11cqw 10cqw;gap:2.1cqw;padding:1cqw .6cqw;font-size:2.4cqw;align-items:center}
.sheet .th{font-weight:700;font-size:2.6cqw}
.sheet .th span:nth-child(2),.sheet .tr .v{text-align:left;direction:ltr}
.sheet .sep{border-top:.5cqw solid #000}
.sheet .grand{margin:1.2cqw -1cqw 0;border:.35cqw solid #000;background:#ececec;padding:.5cqw .8cqw}
.sheet .grand .tr{grid-template-columns:1fr 12cqw 10cqw;padding:.2cqw .6cqw;font-weight:700;font-size:2.6cqw}
.sheet .grand small{display:block;padding:0 .6cqw;font-size:1.8cqw}
.sheet.has2 .th,.sheet.has2 .tr{padding:.55cqw .6cqw;font-size:2.2cqw}.sheet.has2 .th{font-size:2.4cqw}.sheet.has2 .grand .tr{font-size:2.5cqw}
.sheet.no2 .th,.sheet.no2 .tr{padding:2.1cqw .6cqw}.sheet.no2 .hd{margin-bottom:4cqw}.sheet.no2 .meta{margin-bottom:4cqw}.sheet.no2 .grand{margin-top:2.4cqw;padding:.8cqw 1cqw}
@media print{@page{size:A4;margin:8mm}html,body{height:auto;margin:0}body{background:#fff}
#home,#calc,#hist,.acts,.toast,.mnu,.infobox,#tipbox{display:none!important}
#inv{background:#fff;padding:0;min-height:0}
.sheet{max-width:none;break-inside:avoid;page-break-inside:avoid}.sheet,.sheet *{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
.sheet .sar{font-size:1.3em;line-height:.9;vertical-align:-.08em}
.sheet .t2box{background:#ececec;margin:.3cqw -1.4cqw;padding:.3cqw 1.4cqw}
.mi.cx{margin-top:16px}
@media screen and (max-width:700px){#inv{padding-top:46px}}

:root{--cls:#dde4ee;--clsfg:#1f2933;--clsbd:#aab6c8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--cls:#4a5670;--clsfg:#fff;--clsbd:#66748f}}
:root[data-theme="dark"]{--cls:#4a5670;--clsfg:#fff;--clsbd:#66748f}
.mi.cx{background:var(--cls)!important;color:var(--clsfg)!important;border:1.5px solid var(--clsbd)!important}
@media print{.acts,.acts *,#inv .acts{display:none!important;visibility:hidden!important}}
.acts #prn,.acts #pdf{display:none!important}

.sheet.yr .sub{font-size:2.3cqw;color:#555;margin-top:.8cqw}
.sheet.yr .stg{display:grid;grid-template-columns:1fr 1fr;gap:2cqw;margin:2.4cqw 0}
.sheet.yr .st{border:.3cqw solid #d5d9df;border-top:.9cqw solid #1c7f74;border-radius:1.4cqw;padding:1.6cqw 2cqw;background:#fafafa}
.sheet.yr .st.mx{border-top-color:#c0392b}.sheet.yr .st.mn{border-top-color:#2e86c1}.sheet.yr .st.pd{border-top-color:#6b4fb3}
.sheet.yr .st small{display:block;font-size:2.1cqw;color:#666}
.sheet.yr .st b{font-size:4.4cqw;direction:ltr;unicode-bidi:isolate;display:inline-block;line-height:1.3}
.sheet.yr .st .un{font-size:2.1cqw;margin-inline-start:1cqw;color:#444}
.sheet.yr .st em{display:block;font-style:normal;font-size:2cqw;color:#444;margin-top:.6cqw}
.sheet.yr .ch h3{font-size:2.6cqw;margin:0 0 1cqw}
.sheet.yr .lgd{display:flex;gap:3cqw;font-size:1.9cqw;color:#555;margin-top:1cqw;flex-wrap:wrap}
.sheet.yr .lgd i{display:inline-block;width:1.8cqw;height:1.8cqw;border-radius:.4cqw;margin-inline-end:.8cqw;vertical-align:middle}
.sheet.yr .ft{margin-top:2.4cqw;font-size:1.9cqw;color:#777;text-align:left}
.yrb{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--box);border:2px solid #1c7f74;border-radius:12px;padding:8px 14px}
.yrbtn{background:var(--btn);color:var(--btnfg);border:1.5px solid var(--btnbd);border-radius:10px;height:34px;padding:0 14px;font-weight:700;font-size:14px;font-family:inherit;cursor:pointer}
tr.yrw td{padding:10px 8px;border-top:3px solid #1c7f74}
</style>
</head>
<body>
<div id="wideMsg" class="infobox"><span>ℹ️ شاشتك واسعة، يمكنك اختيار <a href="index.html">نسخة المتصفح</a> لتناسب حجم الشاشة.</span><button id="wx" aria-label="إغلاق">✕</button></div>
<div id="home" class="wrap wide">
  <div class="top"><h2>⚡ عدادات الكهرباء</h2></div>
  <div class="top" style="justify-content:flex-start;flex-wrap:wrap"><button class="sm" id="addM">＋ إضافة عداد</button><button class="sm" id="bkb">💾 النسخ الاحتياطي</button><input type="file" id="fi" accept=".json,application/json" class="hide"></div>
  <div class="grid" id="grid"></div>
</div>

<div id="calc" class="wrap hide">
  <div class="top"><h2 id="ct"></h2><button class="sm" id="cb">رجوع ←</button></div>
  <div class="row">
    <div><label for="pd">تاريخ القراءة السابقة</label><input id="pd" type="hidden"><div class="dsel" data-t="pd"></div></div>
    <div><label for="cd">تاريخ القراءة الحالية</label><input id="cd" type="hidden"><div class="dsel" data-t="cd"></div></div>
  </div>
  <label>عدد الأيام</label><input id="days" class="fld days" readonly value="—">
  <label for="prev">قراءة العداد السابق</label><input id="prev" type="text" inputmode="decimal" autocomplete="off" class="fld prev" placeholder="0.00">
  <label for="curr">قراءة العداد الحالي</label><input id="curr" type="text" inputmode="decimal" autocomplete="off" class="fld curr" placeholder="مثال: 2000">
  <details>
    <summary>⚡ إعدادات شرائح الكهرباء والرسوم (قابلة للتعديل) ⌄</summary>
    <label for="p1">سعر الشريحة الأولى (هللة)</label><input id="p1" type="text" inputmode="decimal" autocomplete="off" class="fld">
    <label for="m1">أقصى استهلاك للشريحة الأولى (كيلوواط)</label><input id="m1" type="text" inputmode="decimal" autocomplete="off" class="fld">
    <label for="p2">سعر الشريحة الثانية (هللة)</label><input id="p2" type="text" inputmode="decimal" autocomplete="off" class="fld">
    <label for="fee">رسوم خدمة العداد</label><input id="fee" type="text" inputmode="decimal" autocomplete="off" class="fld">
    <label for="tax">الضريبة (%)</label><input id="tax" type="text" inputmode="decimal" autocomplete="off" class="fld">
  </details>
  <button class="btn b1" id="go">اضغط هنا للحساب</button>
  <div id="err" class="err hide"></div>
  <div id="out" class="hide"><div id="warn" class="warn hide"></div><div class="res" id="res"></div>
    <button class="btn b3" id="mk">حفظ في السجل وإصدار الفاتورة</button>
    <button class="btn b4" id="sv">حفظ في السجل فقط</button></div>
  <button class="btn b2" id="rst">إعادة تعيين</button>
</div>

<div id="hist" class="wrap wide hide">
  <div class="top"><h2 id="ht"></h2><button class="sm" id="hb">رجوع ←</button></div>
  <div class="top"><div class="sortw"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h11M3 9h9M3 14h7M3 19h5M19.5 4v15M16 15.5l3.5 3.5 3.5-3.5"/></svg><span id="sl">التاريخ: الأحدث أولاً</span><select id="so" aria-label="ترتيب"><option value="date">التاريخ: من الأجدد إلى الأقدم</option><option value="hi">قيمة الفاتورة: الأعلى</option><option value="lo">قيمة الفاتورة: الأقل</option></select><b id="hid" class="hide"></b></div><button class="sm" id="dm">حذف العداد</button></div>
  <div id="selbar" class="selbar hide"><b id="selcnt"></b><button class="sm" id="selall">تحديد الكل</button><button class="sm rdb" id="seldel">حذف المحدد</button><button class="sm" id="selx">إلغاء</button></div>
  <div id="tbl"><div id="tb"></div></div>
</div>

<div id="inv" class="hide">

 if(t.getFullYear()!==y||t.getMonth()!==mo-1||t.getDate()!==d)return null;return y+"-"+("0"+mo).slice(-2)+"-"+("0"+d).slice(-2)}

   row("القراءة السابقة",f2(r.prev),"كيلو واط")+row("القراءة الحالية",f2(r.curr),"كيلو واط")+row("الاستهلاك الإجمالي",f2(r.use),"كيلو واط")+'<div class="sep"></div>'+
   row("الشريحة الأولى: الاستهلاك",f2(r.u1),"كيلو واط")+row("الشريحة الأولى: السعر لكل كيلو واط",r.p1,"هللة")+row("الشريحة الأولى: الإجمالي",f2(r.t1),"⃁")+(r.u2>0?'<div class="sep"></div><div class="t2box">'+row("الشريحة الثانية: الاستهلاك",f2(r.u2),"كيلو واط")+row("الشريحة الثانية: السعر لكل كيلو واط",r.p2,"هللة")+row("الشريحة الثانية: الإجمالي",f2(r.t2),"⃁")+'</div>':'')+'<div class="sep"></div>'+
   row("رسوم الخدمة (ثابت)",f2(r.fee),"⃁")+

function txt(r){if(r.kind==="year")return "ملخص عام "+r.y+"\nالمشترك: "+r.name+"\nإجمالي الاستهلاك: "+f2(r.tu)+" كيلو واط\nإجمالي المبالغ المدفوعة: "+f2(r.tp)+" ريال";return"فاتورة استهلاك الكهرباء\nالمشترك: "+r.name+"\nمن "+dmy(r.pd)+" إلى "+dmy(r.cd)+" ("+(r.days===null?"—":r.days)+" يوم)\nالاستهلاك: "+f2(r.use)+" كيلو واط\nالإجمالي المستحق: "+f2(r.tot)+" ريال (شامل الضريبة)"}
function share(r){
  var t=txt(r);
  if(navigator.share){navigator.share({text:t}).catch(function(){})}
  else{var w=window.open("https://wa.me/?text="+encodeURIComponent(t),"_blank");if(!w){try{navigator.clipboard.writeText(t);toast("تم نسخ ملخص الفاتورة")}catch(e){toast("تعذرت المشاركة")}}}
}
$("prn").addEventListener("click",function(){window.print()});
var pdfBlob=null,pdfFor=null;
function prepPdf(r){pdfBlob=null;pdfFor=r;setTimeout(function(){if(pdfFor!==r)return;buildPdf().then(function(b){if(pdfFor===r)pdfBlob=b},function(){})},450)}
$("sh").addEventListener("click",function(){
  if(!viewR)return;
  if(!pdfBlob||pdfFor!==viewR){toast("جارٍ تجهيز الفاتورة، اضغط مرة أخرى بعد لحظة");return}
  var f=null;try{f=new File([pdfBlob],invFile(viewR)+".pdf",{type:"application/pdf"})}catch(e){}
  if(f&&navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f]}).catch(function(e){if(!e||e.name!=="AbortError")share(viewR)});
  else share(viewR);
});
function mkPdf(canvas){
  var jb=atob(canvas.toDataURL("image/jpeg",0.92).split(",")[1]),jpg=new Uint8Array(jb.length);
  for(var i=0;i<jb.length;i++)jpg[i]=jb.charCodeAt(i);
  var w=canvas.width,h=canvas.height,iw=555,ih=iw*h/w,PH=842,parts=[],len=0,off=[];if(ih>802){ih=802;iw=ih*w/h}var px=Math.round((595-iw)/2),py=PH-20-ih;
  function add(x){if(typeof x==="string"){var u=new Uint8Array(x.length);for(var i=0;i<x.length;i++)u[i]=x.charCodeAt(i)&255;x=u}parts.push(x);len+=x.length}
  function obj(n,head,st){off[n]=len;add(n+" 0 obj\n"+head+(st?"\nstream\n":"\n"));if(st){add(st);add("\nendstream\n")}add("endobj\n")}
  var cs="q "+iw.toFixed(2)+" 0 0 "+ih.toFixed(2)+" "+px+" "+py.toFixed(2)+" cm /Im0 Do Q";
  add("%PDF-1.4\n");
  obj(1,"<< /Type /Catalog /Pages 2 0 R >>");
  obj(2,"<< /Type /Pages /Kids [3 0 R] /Count 1 >>");
  obj(3,"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 "+PH+"] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>");
  obj(4,"<< /Type /XObject /Subtype /Image /Width "+w+" /Height "+h+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+jpg.length+" >>",jpg);
  obj(5,"<< /Length "+cs.length+" >>",cs);
  var xr=len;add("xref\n0 6\n0000000000 65535 f \n");
  for(var k=1;k<=5;k++)add(("0000000000"+off[k]).slice(-10)+" 00000 n \n");
  add("trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n"+xr+"\n%%EOF");
  return new Blob(parts,{type:"application/pdf"});
}
function buildPdf(){
  return new Promise(function(res,rej){
    if(!window.html2canvas)return rej(new Error("no-html2canvas"));
    var wrap=document.createElement("div");wrap.style.cssText="position:fixed;left:0;top:0;z-index:-1;width:700px;background:#fff";
    var cl=$("sheet").cloneNode(true);cl.removeAttribute("id");cl.style.maxWidth="none";cl.style.width="700px";wrap.appendChild(cl);document.body.appendChild(wrap);
    html2canvas(cl,{scale:2.5,backgroundColor:"#ffffff",scrollX:0,scrollY:0}).then(function(cv){wrap.remove();res(mkPdf(cv))},function(e){wrap.remove();rej(e)});
  });
}
$("pdf").addEventListener("click",function(){
  if(!viewR)return;
  if(!window.html2canvas)return toast("تعذر تحميل أداة التصدير، تأكد من الاتصال");
  toast("جارٍ تجهيز الملف...");
  var wrap=document.createElement("div");wrap.style.cssText="position:fixed;left:0;top:0;z-index:-1;width:700px;background:#fff";
  var cl=$("sheet").cloneNode(true);cl.removeAttribute("id");cl.style.maxWidth="none";cl.style.width="700px";wrap.appendChild(cl);document.body.appendChild(wrap);
  html2canvas(cl,{scale:2.5,backgroundColor:"#ffffff",scrollX:0,scrollY:0}).then(function(cv){wrap.remove();
    var blob=mkPdf(cv),nm=invFile(viewR)+".pdf";
    return (window.claude?claude.use("downloads"):Promise.resolve(null)).then(function(d){
      if(!d){toast("الحفظ غير متاح هنا");return}
      return d.save({filename:nm,data:blob}).then(function(){toast("تم الحفظ")},function(e){if(!e||e.code!=="declined")toast("تعذر الحفظ")});
    });
  }).catch(function(){wrap.remove();toast("تعذر إنشاء الملف")});
});

$("wx").addEventListener("click",function(){$("wideMsg").classList.add("dis")});
var tipEl=document.createElement("div");tipEl.id="tipbox";document.body.appendChild(tipEl);
function showTip(t){var r=t.getBoundingClientRect();tipEl.textContent=t.getAttribute("data-tip");tipEl.style.display="block";
 var w=tipEl.offsetWidth,x=Math.min(Math.max(8,r.left+r.width/2-w/2),document.documentElement.clientWidth-w-8);
 tipEl.style.left=x+"px";tipEl.style.top=(r.bottom+8)+"px"}
function hideTip(){tipEl.style.display="none"}
document.addEventListener("mouseover",function(e){var t=e.target.closest&&e.target.closest(".tip");if(t)showTip(t)});
document.addEventListener("mouseout",function(e){if(e.target.closest&&e.target.closest(".tip"))hideTip()});
document.addEventListener("click",function(e){var t=e.target.closest&&e.target.closest(".tip");if(t)showTip(t);else hideTip()});
function normNum(v){return String(v).replace(/[\u0660-\u0669]/g,function(d){return d.charCodeAt(0)-1632}).replace(/[\u06F0-\u06F9]/g,function(d){return d.charCodeAt(0)-1776}).replace(/[\u066B\u060C]/g,".").replace(/[^0-9.]/g,"")}
document.addEventListener("input",function(e){var t=e.target;if(t&&t.tagName==="INPUT"&&t.getAttribute("inputmode")==="decimal"){var v=normNum(t.value);if(v!==t.value)t.value=v}},true);
save();home();
})();
